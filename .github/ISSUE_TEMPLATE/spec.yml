name: Spec
description: Write or review the specification of a feature before building it
title: "group-NN: Spec for "
labels: ["spec"]
body:
  - type: markdown
    attributes:
      value: |
        In the title, replace `group-NN` with the group and the next number in that group, for example `client-04`. Groups: `client`, `server`, `devops`, `qa`, `docs`. Add the group label too.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What the user needs and which journey it belongs to (visitor, owner or agency dashboard).
    validations:
      required: true
  - type: input
    id: journey
    attributes:
      label: User journey
      description: Link to the step in `docs/user-journeys.md`, if it applies.
  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: Decisions the spec needs to settle.
