name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  migrations:
    name: Migration rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the migration rules from CONTRIBUTING.md
        run: .github/scripts/check-migrations.sh "origin/${{ github.base_ref }}"

  server:
    name: Server
    runs-on: ubuntu-latest
    services:
      # Throwaway database that only exists while this job runs
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: peephole
          POSTGRES_USER: peephole
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peephole"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/peephole
      DB_USERNAME: peephole
      DB_PASSWORD: ci_only_password
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, check the formatting, apply every migration to an empty database and run the tests
        run: ./mvnw --batch-mode verify

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Type-check and build
        run: npm run build
