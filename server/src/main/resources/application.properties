spring.application.name=server

# Railway sets PORT when it provides one; locally the server runs on 8080
server.port=${PORT:8080}

# Origins allowed to call /api from a browser, comma-separated. On Railway, set it to the client domain
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Agency session cookie, as decided in ADR 0004. Set SESSION_COOKIE_SECURE=true on Railway, where it is served over HTTPS
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Local secrets live in server/.env (never committed). Real environment variables take precedence.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# LOAD_DEMO_DATA=true also runs the demo data migrations in db/seed. Without it, only the schema is created
spring.flyway.locations=${app.flyway.locations.${LOAD_DEMO_DATA:false}}
app.flyway.locations.true=classpath:db/migration,classpath:db/seed
app.flyway.locations.false=classpath:db/migration

# API documentation generated by springdoc, only for local development: /v3/api-docs (JSON) and /swagger-ui.html
# Off unless API_DOCS_ENABLED=true, so it is never public on Railway
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
# Swagger UI sends the XSRF-TOKEN cookie as the X-XSRF-TOKEN header, so "Try it out" works with CSRF (ADR 0004)
springdoc.swagger-ui.csrf.enabled=true
# Each endpoint lists its own error responses, instead of every handler in RestExceptionHandler
springdoc.override-with-generic-response=false
