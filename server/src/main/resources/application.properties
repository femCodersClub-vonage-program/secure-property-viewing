spring.application.name=server

# The server listens on PORT when it is set and on 8080 otherwise. PORT is not set on its Railway service,
# so it runs on 8080 there too, the port client/Caddyfile sends /api to: keep them in sync
server.port=${PORT:8080}

# Agency session cookie, as decided in ADR 0004. Set SESSION_COOKIE_SECURE=true on Railway, where it is served over HTTPS.
# SecurityConfig gives the XSRF-TOKEN cookie the same Secure flag
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Local secrets live in server/.env (never committed). Real environment variables take precedence.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# LOAD_DEMO_DATA=true also runs the demo data migrations in db/seed. Without it, only the schema is created
spring.flyway.locations=${app.flyway.locations.${LOAD_DEMO_DATA:false}}
app.flyway.locations.true=classpath:db/migration,classpath:db/seed
app.flyway.locations.false=classpath:db/migration

# API documentation generated by springdoc, only for local development: /v3/api-docs (JSON) and /swagger-ui.html
# Off unless API_DOCS_ENABLED=true, so it is never public on Railway
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
# Swagger UI sends the XSRF-TOKEN cookie as the X-XSRF-TOKEN header, so "Try it out" works with CSRF (ADR 0004)
springdoc.swagger-ui.csrf.enabled=true
# Each endpoint lists its own error responses, instead of every handler in RestExceptionHandler
springdoc.override-with-generic-response=false

# Phone verification (specs/phone-verification.md). Empty by default so the server can say which variable is missing
app.phone-hash-secret=${PHONE_HASH_SECRET:}
app.vonage.verify.application-id=${VONAGE_VERIFY_APPLICATION_ID:}
app.vonage.verify.private-key=${VONAGE_VERIFY_PRIVATE_KEY:}

# Video visit (specs/video-visit.md), with Viviana's application. Empty by default for the same reason
app.vonage.video.application-id=${VONAGE_VIDEO_APPLICATION_ID:}
app.vonage.video.private-key=${VONAGE_VIDEO_PRIVATE_KEY:}

# Post-visit call (specs/post-visit-call.md), with Irina's application. Off by default, so local development and the
# tests need no Vonage number. On, the server doesn't start while a Voice variable is missing
app.voice.calls-enabled=${VOICE_CALLS_ENABLED:false}
app.voice.call-delay-minutes=${POST_VISIT_CALL_DELAY_MINUTES:15}
# The server's public domain, such as an ngrok tunnel locally, which the webhook URLs are built from
app.server-public-url=${SERVER_PUBLIC_URL:}
app.vonage.voice.application-id=${VONAGE_VOICE_APPLICATION_ID:}
app.vonage.voice.private-key=${VONAGE_VOICE_PRIVATE_KEY:}
# The Spanish Vonage number the call comes from, in E.164 without the plus sign
app.vonage.voice.from-number=${VONAGE_VOICE_FROM_NUMBER:}
# The signature secret of the Vonage account that owns the application, to check the voice webhooks
app.vonage.voice.signature-secret=${VONAGE_VOICE_SIGNATURE_SECRET:}
